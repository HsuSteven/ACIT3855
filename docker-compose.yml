services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fitness_db
      MYSQL_USER: shsu
      MYSQL_PASSWORD: password
      TZ: America/Vancouver
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "-u", "shsu", "-ppassword", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    build:
      context: Storage
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://shsu:password@db:3306/fitness_db
    depends_on:
      db:
        condition: service_healthy

  receiver:
    build:
      context: Receiver
      dockerfile: Dockerfile
    restart: always
    environment:
      STORAGE_SERVICE_URL: http://storage:8090
    depends_on:
      - storage
    ports:
      - "8080:8080"
    volumes:
      - ./Receiver/app.log:/app/app.log

  processing:
    build:
      context: Processing
      dockerfile: Dockerfile
    restart: always
    environment:
      STORAGE_SERVICE_URL: http://storage:8090
    depends_on:
      - storage
    ports:
      - "8100:8100"
    volumes:
      # Bind mount stats.json so updates persist and can be viewed directly in VS Code
      - ./Processing/stats.json:/app/stats.json

volumes:
  mysql_data: